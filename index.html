<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E6B4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="体成分计划">
<meta name="description" content="按日打卡的训练、饮食与采购计划">
<title>体成分计划 · 48 周</title>
<style>
:root{
  --green:#1E6B4F;
  --green-2:#2F8A66;
  --green-3:#E7F1EB;
  --bg:#F3F4EF;
  --card:#FFFFFF;
  --ink:#1B1B18;
  --muted:#7B7C74;
  --line:#E3E5DD;
  --amber:#B06F1C;
  --amber-bg:#FBF0E2;
  --red:#AD4630;
  --red-bg:#FBEAE5;
  --shadow:0 1px 2px rgba(20,30,20,.04), 0 8px 24px rgba(20,30,20,.05);
  --radius:18px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  font-size:15px;
  line-height:1.55;
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}

.app{max-width:980px;margin:0 auto;padding:0 14px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  background:rgba(243,244,239,.92);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
  padding:10px 0 8px;
}
.topbar-inner{max-width:980px;margin:0 auto;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:.2px}
.brand .dot{width:9px;height:9px;border-radius:3px;background:var(--green);display:inline-block}
.brand small{font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.4px}
.daynav{display:flex;align-items:center;gap:4px}
.iconbtn{
  width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
  background:#fff;border:1px solid var(--line);color:var(--muted);font-size:18px;line-height:1;
}
.iconbtn:active{background:var(--green-3)}
.daynav .today-btn{
  height:34px;padding:0 12px;border-radius:11px;background:#fff;border:1px solid var(--line);
  font-size:12.5px;color:var(--green);font-weight:600;
}

/* ---------- cards ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:16px;margin-top:12px;
}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.card-title{font-size:14.5px;font-weight:700;letter-spacing:.2px}
.card-sub{font-size:11.5px;color:var(--muted)}
.card-link{font-size:12px;color:var(--green);font-weight:600}

/* ---------- hero ---------- */
.hero{
  margin-top:12px;background:linear-gradient(140deg,#1E6B4F 0%,#2C7F5E 55%,#3B8F6B 100%);
  border-radius:22px;color:#fff;padding:18px 18px 16px;position:relative;overflow:hidden;
  box-shadow:0 12px 30px rgba(30,107,79,.22);
}
.hero:after{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hero-date{font-size:20px;font-weight:700;letter-spacing:.3px}
.hero-meta{font-size:12px;opacity:.82;margin-top:2px}
.hero-badge{
  display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;
}
.hero-stats{display:flex;gap:18px;margin-top:16px;flex-wrap:wrap}
.hstat{min-width:88px}
.hstat .v{font-size:19px;font-weight:700;letter-spacing:.2px}
.hstat .v span{font-size:11px;font-weight:500;opacity:.75;margin-left:2px}
.hstat .k{font-size:11px;opacity:.75;margin-top:1px}
.hero-bar{height:6px;border-radius:99px;background:rgba(255,255,255,.18);margin-top:14px;overflow:hidden}
.hero-bar i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .3s ease}

/* ---------- segmented ---------- */
.seg{display:inline-flex;background:#F1F2EC;border-radius:10px;padding:3px;gap:2px}
.seg button{
  padding:5px 9px;border-radius:8px;font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap;
}
.seg button.on[data-v="done"]{background:var(--green);color:#fff}
.seg button.on[data-v="part"]{background:#E9A94A;color:#3B2508}
.seg button.on[data-v="none"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* ---------- exercise ---------- */
.ex{padding:11px 0;border-top:1px dashed var(--line)}
.ex:first-of-type{border-top:0}
.ex-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ex-name{font-size:14px;font-weight:600;line-height:1.35}
.ex-name em{font-style:normal;color:var(--muted);font-weight:500;font-size:12px;margin-left:6px}
.ex-tip{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45}
.ex-meta{display:flex;gap:8px;margin-top:8px}
.ex-meta input{
  flex:1;min-width:0;height:34px;border-radius:10px;border:1px solid var(--line);background:#FAFAF7;
  padding:0 10px;font-size:12.5px;outline:none;
}
.ex-meta input:focus{border-color:var(--green-2);background:#fff}

/* ---------- meals ---------- */
.meal{border-top:1px solid var(--line);padding:10px 0}
.meal:first-of-type{border-top:0;padding-top:0}
.meal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.meal-name{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.meal-name .t{font-size:10.5px;color:var(--muted);font-weight:500}
.meal-kcal{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meal-kcal b{color:var(--ink);font-size:13px}
.foodlist{margin-top:6px}
.foodrow{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px}
.foodrow .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foodrow .fg{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.foodrow .fk{font-size:12px;font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.del{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#B9BAB2;font-size:15px}
.del:active{background:var(--red-bg);color:var(--red)}
.addfood{
  margin-top:6px;width:100%;height:36px;border-radius:11px;border:1px dashed #CFD8CF;
  color:var(--green);font-size:12.5px;font-weight:600;background:#FBFCF9;
}
.addfood:active{background:var(--green-3)}
.meal-empty{font-size:12px;color:#A9AAA2;padding:4px 0}

/* ---------- habits ---------- */
.habits{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.habit{background:#FAFAF7;border:1px solid var(--line);border-radius:14px;padding:10px}
.habit .hk{font-size:11px;color:var(--muted)}
.habit .hv{font-size:16px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.habit .hv span{font-size:11px;font-weight:500;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:6px;margin-top:6px}
.stepper button{
  width:26px;height:26px;border-radius:8px;background:#fff;border:1px solid var(--line);
  font-size:15px;line-height:1;display:grid;place-items:center;color:var(--green)
}
.habit input[type=number]{
  width:100%;height:30px;margin-top:6px;border:1px solid var(--line);border-radius:9px;background:#fff;
  padding:0 8px;font-size:13px;outline:none;
}
.habit input:focus{border-color:var(--green-2)}

/* ---------- note ---------- */
.note{width:100%;min-height:62px;border:1px solid var(--line);border-radius:12px;background:#FAFAF7;padding:10px;font-size:13px;resize:vertical;outline:none;line-height:1.6}
.note:focus{border-color:var(--green-2);background:#fff}

/* ---------- buttons ---------- */
.btn{
  height:40px;padding:0 16px;border-radius:12px;font-size:13.5px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn.primary{background:var(--green);color:#fff}
.btn.primary:active{background:#175840}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--red-bg);color:var(--red)}
.btn.block{width:100%}

/* ---------- tab bar ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar-inner{max-width:980px;margin:0 auto;display:flex}
.tab{flex:1;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#97988F}
.tab .ti{font-size:18px;line-height:1}
.tab .tl{font-size:10.5px;font-weight:600;letter-spacing:.2px}
.tab.on{color:var(--green)}
.tab.on .tl{font-weight:700}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-month{font-size:15px;font-weight:700}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.cal-week span{text-align:center;font-size:10.5px;color:var(--muted)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day{
  aspect-ratio:1/1;border-radius:11px;background:#FAFAF7;border:1px solid transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;
  color:var(--ink);position:relative;
}
.cal-day.out{opacity:.32}
.cal-day .d{font-variant-numeric:tabular-nums}
.cal-day .dot{width:5px;height:5px;border-radius:50%;background:#D9DAD2}
.cal-day.done .dot{background:var(--green)}
.cal-day.part .dot{background:#E0A03F}
.cal-day.none .dot{background:#D14B33}
.cal-day.rest{background:#F3F4EF}
.cal-day.today{border-color:var(--green);background:var(--green-3)}
.cal-day.today .d{font-weight:800;color:var(--green)}
.cal-legend{display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.cal-legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:#FAFAF7;border:1px solid var(--line);border-radius:14px;padding:11px}
.stat .k{font-size:11px;color:var(--muted)}
.stat .v{font-size:18px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:11px;font-weight:500;color:var(--muted);margin-left:2px}

/* ---------- body metrics ---------- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.field input{
  width:100%;height:38px;border:1px solid var(--line);border-radius:11px;background:#FAFAF7;
  padding:0 10px;font-size:13.5px;outline:none;font-variant-numeric:tabular-nums;
}
.field input:focus{border-color:var(--green-2);background:#fff}
.mlist{margin-top:10px;border-top:1px solid var(--line)}
.mrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.mrow .md{color:var(--muted);width:74px;flex:none;font-variant-numeric:tabular-nums}
.mrow .mv{flex:1;font-variant-numeric:tabular-nums}
.mrow .mv b{font-weight:700}
.mrow .mv span{color:var(--muted);margin-left:4px}
.chart{margin-top:10px}
.chart svg{width:100%;height:auto;display:block}

/* ---------- plan ---------- */
details.acc{border-top:1px solid var(--line);padding:12px 0}
details.acc:first-of-type{border-top:0;padding-top:2px}
details.acc summary{list-style:none;display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:700;cursor:pointer}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary:after{content:"+";color:var(--muted);font-weight:400;font-size:18px}
details.acc[open] summary:after{content:"–"}
.acc-body{padding-top:8px;font-size:13px;color:#3A3B35;line-height:1.7}
.acc-body p{margin:0 0 6px}
.acc-body ul{margin:4px 0 6px;padding-left:18px}
.acc-body li{margin:2px 0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:600}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:700;background:var(--green-3);color:var(--green)}
.tag.amber{background:var(--amber-bg);color:var(--amber)}
.tag.red{background:var(--red-bg);color:var(--red)}
.plan-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
.plan-table th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;padding:5px 4px;border-bottom:1px solid var(--line)}
.plan-table td{padding:6px 4px;border-bottom:1px dashed var(--line);vertical-align:top}
.plan-table tr:last-child td{border-bottom:0}

/* ---------- shopping ---------- */
.shop-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.shop-prog{height:6px;border-radius:99px;background:#EDEEE7;overflow:hidden;margin:10px 0 4px}
.shop-prog i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .25s}
.shop-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.shop-item:last-child{border-bottom:0}
.shop-check{
  width:21px;height:21px;border-radius:7px;border:1.6px solid #C9CCC2;flex:none;
  display:grid;place-items:center;color:#fff;font-size:12px;background:#fff;
}
.shop-item.on .shop-check{background:var(--green);border-color:var(--green)}
.shop-item.on .sn{color:var(--muted);text-decoration:line-through}
.shop-item .sn{font-size:13px;font-weight:600}
.shop-item .sa{flex:1;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.shop-cat{font-size:10.5px;color:var(--muted);width:34px;flex:none}

/* ---------- modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(20,25,20,.42);z-index:80;display:flex;align-items:flex-end;
  justify-content:center;padding:0;animation:fade .16s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;
  max-height:88vh;display:flex;flex-direction:column;animation:up .22s cubic-bezier(.2,.8,.2,1);
}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet-h{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.sheet-t{font-size:15px;font-weight:700}
.sheet-b{overflow-y:auto;padding:12px 16px;flex:1;-webkit-overflow-scrolling:touch}
.sheet-f{padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px}
.search{
  width:100%;height:42px;border:1px solid var(--line);border-radius:12px;background:#FAFAF7;
  padding:0 12px;font-size:14px;outline:none;
}
.search:focus{border-color:var(--green-2);background:#fff}
.cats{display:flex;gap:6px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{
  padding:6px 11px;border-radius:999px;background:#F2F3EC;font-size:11.5px;color:#5D5E56;white-space:nowrap;font-weight:600;border:1px solid transparent;
}
.chip.on{background:var(--green-3);color:var(--green);border-color:#C9DED2}
.fitem{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F0F1EA;cursor:pointer}
.fitem:active{background:#FAFBF7}
.fitem .fi{flex:1;min-width:0}
.fitem .fname{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fitem .fsub{font-size:11px;color:var(--muted);margin-top:1px}
.fitem .fk{font-size:12.5px;color:var(--green);font-weight:700;font-variant-numeric:tabular-nums}
.custom-tag{font-size:9.5px;background:var(--amber-bg);color:var(--amber);padding:1px 5px;border-radius:5px;margin-left:5px;vertical-align:1px}
.grams{display:flex;gap:8px;align-items:center;margin:6px 0 10px}
.grams input{
  flex:1;height:46px;border:1px solid var(--line);border-radius:13px;padding:0 12px;font-size:18px;font-weight:700;
  text-align:center;outline:none;font-variant-numeric:tabular-nums;
}
.grams .u{font-size:12px;color:var(--muted);width:34px}
.qchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.qchip{padding:6px 12px;border-radius:9px;background:#F2F3EC;font-size:12px;font-weight:600;color:#55564E}
.qchip.on{background:var(--green);color:#fff}
.calcbox{background:var(--green-3);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;margin-bottom:10px}
.calcbox .cv{font-size:18px;font-weight:800;color:var(--green)}
.calcbox .ck{font-size:10.5px;color:#5F7A6C}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);
  background:rgba(27,32,27,.92);color:#fff;font-size:12.5px;padding:8px 14px;border-radius:999px;z-index:99;
  opacity:0;transition:.22s ease;pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- records sub nav ---------- */
.subnav{display:flex;background:#E9EBE3;border-radius:13px;padding:3px;margin-top:12px}
.subnav button{flex:1;height:36px;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.subnav button.on{background:#fff;color:var(--green);box-shadow:0 1px 3px rgba(20,30,20,.08)}
.wrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.wrow:last-child{border-bottom:0}
.wrow .wd{width:56px;flex:none;font-size:12px;line-height:1.25;color:var(--ink);font-weight:600}
.wrow .wn{flex:1;min-width:0;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .ws{font-size:11px;padding:3px 9px;border-radius:999px;background:#F1F2EC;color:var(--muted);white-space:nowrap}
.wrow .ws.done{background:var(--green-3);color:var(--green)}
.wrow .ws.part{background:var(--amber-bg);color:var(--amber)}
.wrow .ws.miss{background:var(--red-bg);color:var(--red)}

/* ---------- swap exercise ---------- */
.exdir{font-size:10.5px;font-weight:700;color:var(--green);display:flex;align-items:center;gap:6px;margin-bottom:2px}
.eqtag{font-size:9.5px;font-weight:600;color:#77786F;background:#F1F2EC;padding:1px 6px;border-radius:5px}
.swap{flex:none;height:30px;padding:0 12px;border-radius:9px;border:1px solid #CFDCD3;background:#F7FBF8;color:var(--green);font-size:12px;font-weight:700}
.opt{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:13px;border:1px solid var(--line);margin-bottom:8px;cursor:pointer}
.opt.on{border-color:#9CC4AE;background:#F5FAF7}
.oi{flex:1;min-width:0}
.optname{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.osub{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.45}
.ocheck{color:var(--green);font-weight:800;font-size:15px}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#3A3B35;padding:10px 2px 2px;cursor:pointer}
.cbox{width:20px;height:20px;border-radius:6px;border:1.6px solid #C9CCC2;display:grid;place-items:center;font-size:12px;color:#fff;background:#fff;flex:none}
.cbox.on{background:var(--green);border-color:var(--green)}
.slotrow{padding:10px 0;border-bottom:1px dashed var(--line)}
.slotrow:last-child{border-bottom:0}
.slotdir{font-size:10.5px;font-weight:700;color:var(--green)}
.slotdef{font-size:12.5px;font-weight:600;margin-top:2px}
.slotopts{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.optpill{font-size:10.5px;padding:3px 8px;border-radius:999px;background:#F2F3EC;color:#5D5E56;display:inline-flex;align-items:center;gap:4px}
.optpill.on{background:var(--green-3);color:var(--green)}
.optpill i{font-style:normal;color:#9A9B93;font-size:9px}
.optpill.on i{color:#6C8F7C}

/* ---------- tutorial ---------- */
.tut{border-bottom:1px solid var(--line)}
.tut:last-child{border-bottom:0}
.tut-h{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer}
.tut-thumb{width:92px;height:62px;flex:none;border-radius:12px;overflow:hidden;background:#F1F6F2}
.tut-thumb svg{width:100%;height:100%;display:block}
.tut-meta{flex:1;min-width:0}
.tut-name{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tut-sub{font-size:10.5px;color:var(--muted);margin-top:3px}
.tut-arrow{width:22px;text-align:center;color:#A9AAA2;font-size:18px;flex:none}
.tut.open .tut-arrow{color:var(--green)}
.tut-body{padding:2px 0 14px}
.tut-fig{position:relative;border-radius:14px;overflow:hidden;background:#F1F6F2;margin-bottom:2px}
.tut-fig.live{cursor:pointer}
.livebadge{position:absolute;right:8px;bottom:8px;background:rgba(30,107,79,.88);color:#fff;font-size:9.5px;padding:3px 8px;border-radius:999px;pointer-events:none}
.livebadge2{font-size:9px;font-weight:700;background:#E7F1EB;color:#1E6B4F;padding:1px 6px;border-radius:5px}
.tut-fig svg{width:100%;height:auto;display:block}
.tut-sec{font-size:11px;font-weight:800;color:var(--green);margin:12px 0 5px;letter-spacing:.5px}
.steps{margin:0;padding-left:19px;font-size:12.5px;line-height:1.75;color:#3A3B35}
.steps li{margin:2px 0}
.errs{margin:0;padding:0;list-style:none;font-size:12.5px;line-height:1.75;color:#8A4A22}
.errs li:before{content:"✕ ";font-size:10px;color:#C05621}
.tut-breath{background:var(--green-3);border-radius:11px;padding:9px 11px;font-size:11.5px;line-height:1.6;color:#2C5745;margin-top:10px}
.tut-safe{background:var(--amber-bg);border-radius:11px;padding:9px 11px;font-size:11.5px;line-height:1.6;color:#7A4E14;margin-top:8px}

/* ---------- misc ---------- */
.hr{height:1px;background:var(--line);margin:12px 0}
.muted{color:var(--muted)}
.small{font-size:11.5px}
.center{text-align:center}
.section-gap{height:4px}
.row{display:flex;align-items:center;gap:8px}
.row.between{justify-content:space-between}
.warnbox{background:var(--amber-bg);border-radius:12px;padding:10px 12px;font-size:12px;color:#7A4E14;line-height:1.6}

@media(min-width:880px){
  body{font-size:15px}
  .today-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:12px;align-items:start}
  .today-grid > .card{margin-top:0}
  .today-grid .col{display:flex;flex-direction:column;gap:12px}
  .habit{padding:12px}
  .tabbar-inner{border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:18px 18px 0 0}
}

  core: '<svg viewBox="0 0 220 150" xmlns="http://www.w3.org/2000/svg"><rect width="220" height="150" rx="14" fill="#F1F6F2"/><line x1="16" y1="132" x2="204" y2="132" stroke="#D8DFD6" stroke-width="4" stroke-linecap="round"/><circle cx="40" cy="116" r="9" fill="#1E6B4F"/><path d="M52 118 L104 118" stroke="#1E6B4F" stroke-width="9" stroke-linecap="round"/><path d="M58 118 L54 88" stroke="#1E6B4F" stroke-width="8" stroke-linecap="round"><animate attributeName="d" values="M58 118 L54 88;M58 118 L24 112;M58 118 L54 88" dur="' + A_DUR + '" ' + A_EASE + '/></path><path d="M66 118 L62 96" stroke="#1E6B4F" stroke-width="8" stroke-linecap="round" opacity=".32"/><path d="M104 118 L124 94 L148 86" stroke="#1E6B4F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"><animate attributeName="d" values="M104 118 L124 94 L148 86;M104 118 L140 118 L162 124;M104 118 L124 94 L148 86" dur="' + A_DUR + '" ' + A_EASE + '/></path><path d="M104 118 L120 102 L142 96" stroke="#1E6B4F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity=".32"/><path d="M166 92 L184 84" stroke="#D08A2C" stroke-width="3" stroke-dasharray="6 5"/><polygon points="190,81 180,80 184,89" fill="#D08A2C"/></svg>'
};

FIGS.nordicstill = FIGS.legcurl;
FIGS.pallofstill = FIGS.core;
FIGS.stretchstill = FIGS.core;


</script>
<script>
/* ================= 体成分计划 · 交互版 ================= */
(function () {
  "use strict";

  var KEY = "bcplan.v1";
  var START = "2026-10-19";
  var MEALS = [
    { k: "breakfast", n: "早餐", t: "07:30", target: 500 },
    { k: "lunch", n: "午餐", t: "12:00", target: 700 },
    { k: "snack", n: "加餐", t: "17:00", target: 200 },
    { k: "dinner", n: "晚餐", t: "19:30", target: 500 }
  ];
  var STATUS = { done: "完成", part: "部分", none: "未完成" };
  var REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  var S = load();
  var ui = {
    tab: "today",
    date: todayStr(),
    cal: null,
    subtab: "calendar",
    weekStart: weekStart(todayStr() < START ? START : todayStr()),
    sumMonth: (function () {
      var a = todayStr() < START ? START : todayStr();
      return { y: parseInt(a.slice(0, 4), 10), m: parseInt(a.slice(5, 7), 10) - 1 };
    })(),
    tutOpen: null,
    tutFilter: "all",
    tutQ: "",
    modal: null,
    toastT: null
  };
  ui.cal = { y: parseInt(ui.date.slice(0, 4), 10), m: parseInt(ui.date.slice(5, 7), 10) - 1 };

  /* ---------------- 基础工具 ---------------- */
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function todayStr() { return ymd(new Date()); }
  function parseYmd(s) {
    var a = s.split("-").map(Number);
    return new Date(a[0], a[1] - 1, a[2], 12, 0, 0);
  }
  function addDays(s, n) {
    var d = parseYmd(s);
    d.setDate(d.getDate() + n);
    return ymd(d);
  }
  function wd(s) { return parseYmd(s).getDay(); }
  function dayDiff(a, b) { return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }
  function uid() { return Math.random().toString(36).slice(2, 9); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function round(n) { return Math.round(n || 0); }
  function sum(a) { return a.reduce(function (x, y) { return x + y; }, 0); }

  var WD_CN = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];

  /* ---------------- 状态 ---------------- */
  function defaultState() {
    return {
      version: 1,
      settings: { kcal: 2050, protein: 130, startWeight: 102.4, goalWeight: 81.5, startDate: START },
      days: {},
      customFoods: [],
      body: {},
      reviews: {},
      prefs: {},
      shop: { week: "", checked: {} },
      lastExport: null
    };
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return defaultState();
      var o = JSON.parse(raw);
      var d = defaultState();
      o.settings = Object.assign(d.settings, o.settings || {});
      if (o.settings.startDate === "2026-10-17") o.settings.startDate = START;
      o.days = o.days || {};
      o.customFoods = o.customFoods || [];
      o.body = o.body || {};
      o.reviews = o.reviews || {};
      o.prefs = o.prefs || {};
      o.shop = o.shop || { week: "", checked: {} };
      return o;
    } catch (e) {
      return defaultState();
    }
  }
  var saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 120);
  }
  function flush() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast("保存失败：浏览器存储空间不足"); }
  }

  function emptyDay() {
    return {
      train: {},
      meals: { breakfast: [], lunch: [], snack: [], dinner: [] },
      water: 0, sleep: null, steps: null, note: ""
    };
  }
  function getDay(k) { return S.days[k] || emptyDay(); }
  function ensureDay(k) { if (!S.days[k]) S.days[k] = emptyDay(); return S.days[k]; }

  /* ---------------- 计划 ---------------- */
  function planFor(dateStr) {
    var p = WEEK_PLAN[wd(dateStr)];
    if (p.type === "A" || p.type === "B" || p.type === "C") {
      var t = TRAIN[p.type];
      return {
        kind: p.type, name: t.name, tag: t.tag,
        slots: [{ id: "warmup", dir: "热身", def: "warmup", opts: ["warmup"] }].concat(t.slots)
      };
    }
    if (p.type === "cardio") return { kind: "cardio", name: CARDIO.name, tag: CARDIO.tag, slots: CARDIO.slots };
    if (p.type === "optional") return {
      kind: "optional", name: "可选有氧", tag: "可选",
      slots: [{ id: "optional", dir: "有氧 · 任选一项", def: "walk", opts: ["walk", "elliptical", "bike", "outdoor", "swim"] }]
    };
    return { kind: "rest", name: "休息日", tag: "休息", slots: REST.slots };
  }

  function allSlots() {
    var arr = [];
    ["A", "B", "C"].forEach(function (k) {
      TRAIN[k].slots.forEach(function (s) { arr.push(s); });
    });
    CARDIO.slots.forEach(function (s) { arr.push(s); });
    arr.push({ id: "optional", dir: "有氧 · 任选一项", def: "walk", opts: ["walk", "elliptical", "bike", "outdoor", "swim"] });
    return arr;
  }
  function findSlot(id) {
    return allSlots().filter(function (s) { return s.id === id; })[0];
  }
  function exFor(slot, dateStr) {
    var rec = (S.days[dateStr] && S.days[dateStr].train[slot.id]) || {};
    var exId = rec.ex || S.prefs[slot.id] || slot.def;
    return { id: exId, ex: EX[exId] || EX[slot.def], custom: !!(rec.ex || S.prefs[slot.id]) };
  }

  function trainStats(dateStr) {
    var plan = planFor(dateStr);
    var d = S.days[dateStr];
    var done = 0, total = plan.slots.length, any = false;
    plan.slots.forEach(function (item) {
      var r = d && d.train[item.id];
      if (!r || !r.v || r.v === "none") return;
      any = true;
      done += r.v === "done" ? 1 : 0.5;
    });
    return { done: done, total: total, pct: total ? done / total : 0, any: any };
  }

  function dayStatus(k) {
    var d = S.days[k];
    if (!d) return "";
    var st = trainStats(k);
    if (st.any) return st.pct >= 0.999 ? "done" : "part";
    var food = MEALS.some(function (m) { return (d.meals[m.k] || []).length; });
    if (food || d.water || d.sleep || d.steps || d.note) return "none";
    return "";
  }

  function phaseFor(dateStr) {
    for (var i = 0; i < PHASES.length; i++) {
      if (dateStr >= PHASES[i].start && dateStr <= PHASES[i].end) return PHASES[i];
    }
    return null;
  }
  function weekIndex(dateStr) {
    var n = dayDiff(S.settings.startDate || START, dateStr);
    return n < 0 ? 0 : Math.floor(n / 7) + 1;
  }

  function mealTotals(d, key) {
    var arr = (d.meals && d.meals[key]) || [];
    return {
      k: sum(arr.map(function (x) { return x.k; })),
      p: sum(arr.map(function (x) { return x.p; }))
    };
  }
  function dayTotals(d) {
    var k = 0, p = 0;
    MEALS.forEach(function (m) {
      var t = mealTotals(d, m.k);
      k += t.k; p += t.p;
    });
    return { k: k, p: p };
  }

  /* ---------------- 通用片段 ---------------- */
  function hero(dateStr) {
    var plan = planFor(dateStr);
    var st = trainStats(dateStr);
    var d = getDay(dateStr);
    var tot = dayTotals(d);
    var ph = phaseFor(dateStr);
    var wk = weekIndex(dateStr);
    var startDate = S.settings.startDate || START;
    var pre = dateStr < startDate;
    var meta = pre
      ? "开营前 · " + startDate.slice(5).replace("-", "/") + " 开始"
      : (wk ? "第 " + wk + " 周 · " : "") + (ph ? ph.name : "周期外");
    var dt = parseYmd(dateStr);
    var kcalPct = Math.min(100, Math.round(tot.k / S.settings.kcal * 100));
    return '' +
      '<section class="hero">' +
        '<div class="hero-top">' +
          '<div>' +
            '<div class="hero-date">' + (dt.getMonth() + 1) + '月' + dt.getDate() + '日 · ' + WD_CN[dt.getDay()] + '</div>' +
            '<div class="hero-meta">' + meta + ' · ' + plan.tag + '</div>' +
          '</div>' +
          '<div class="hero-badge">' + plan.name + '</div>' +
        '</div>' +
        '<div class="hero-stats">' +
          '<div class="hstat"><div class="v">' + fmtNum(st.done) + '<span>/' + st.total + '</span></div><div class="k">训练完成</div></div>' +
          '<div class="hstat"><div class="v">' + round(tot.k) + '<span>kcal</span></div><div class="k">已摄入 / ' + S.settings.kcal + '</div></div>' +
          '<div class="hstat"><div class="v">' + round(tot.p) + '<span>g</span></div><div class="k">蛋白 / ' + S.settings.protein + 'g</div></div>' +
        '</div>' +
        '<div class="hero-bar"><i style="width:' + kcalPct + '%"></i></div>' +
      '</section>';
  }
  function fmtNum(n) { return n % 1 === 0 ? String(n) : n.toFixed(1); }

  function seg(act, id, val) {
    var opts = [["done", "完成"], ["part", "部分"], ["none", "未完成"]];
    var cur = val || "none";
    return '<div class="seg">' + opts.map(function (o) {
      return '<button data-act="' + act + '" data-id="' + id + '" data-v="' + o[0] + '" class="' + (cur === o[0] ? "on" : "") + '">' + o[1] + '</button>';
    }).join("") + '</div>';
  }

  /* ---------------- 今日 ---------------- */
  function viewToday() {
    var dateStr = ui.date;
    var plan = planFor(dateStr);
    var d = getDay(dateStr);
    var st = trainStats(dateStr);
    var tot = dayTotals(d);
    var durMap = { A: "约 55 分钟", B: "约 55 分钟", C: "约 55 分钟", cardio: "约 35 分钟", optional: "40–50 分钟（可选）", rest: "10 分钟拉伸" };

    var trainCard = '<section class="card">' +
      '<div class="card-h"><div><div class="card-title">今日训练</div>' +
      '<div class="card-sub">' + plan.name + ' · ' + (durMap[plan.kind] || "约 55 分钟") + '</div></div>' +
      '<div class="tag">' + Math.round(st.pct * 100) + '%</div></div>' +
      plan.slots.map(function (slot) {
        var r = d.train[slot.id] || {};
        var cur = exFor(slot, dateStr);
        return '<div class="ex">' +
          '<div class="ex-top">' +
            '<div style="flex:1;min-width:0">' +
              '<div class="exdir">' + esc(slot.dir) + (cur.ex.eq && cur.ex.eq !== "—" ? '<span class="eqtag">' + esc(cur.ex.eq) + '</span>' : '') + '</div>' +
              '<div class="ex-name">' + esc(cur.ex.n) + '<em>' + esc(cur.ex.s) + '</em></div>' +
              '<div class="ex-tip">' + esc(cur.ex.tip || "") + '</div>' +
            '</div>' +
            (slot.opts.length > 1 ? '<button class="swap" data-act="swap" data-slot="' + slot.id + '">换</button>' : '') +
          '</div>' +
          '<div style="margin-top:8px">' + seg("status", slot.id, r.v) + '</div>' +
          (plan.kind === "rest" ? "" :
            '<div class="ex-meta">' +
              '<input data-bind="ex" data-id="' + slot.id + '" data-f="w" value="' + esc(r.w || "") + '" placeholder="重量 / 组数，如 60kg">' +
              '<input data-bind="ex" data-id="' + slot.id + '" data-f="note" value="' + esc(r.note || "") + '" placeholder="备注">' +
            '</div>') +
        '</div>';
      }).join("") +
      (plan.slots.some(function (s) { return s.opts.length > 1; })
        ? '<div class="small muted" style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)">找不到对应器械？点「换」，训练方向不变，动作可以替代。</div>'
        : '') +
    '</section>';

    var mealsCard = '<section class="card">' +
      '<div class="card-h"><div class="card-title">今日饮食</div>' +
      '<div class="card-sub">' + round(tot.k) + ' / ' + S.settings.kcal + ' kcal · 蛋白 ' + round(tot.p) + 'g</div></div>' +
      MEALS.map(function (m) {
        var items = (d.meals && d.meals[m.k]) || [];
        var t = mealTotals(d, m.k);
        var pre = PRESETS.filter(function (p) { return p.meal === m.k; });
        return '<div class="meal">' +
          '<div class="meal-head"><div class="meal-name">' + m.n + '<span class="t">' + m.t + '</span></div>' +
          '<div class="meal-kcal"><b>' + round(t.k) + '</b> kcal</div></div>' +
          (items.length ? '<div class="foodlist">' + items.map(function (x, i) {
            return '<div class="foodrow"><span class="fn">' + esc(x.n) + '</span>' +
              '<span class="fg">' + x.g + 'g</span><span class="fk">' + round(x.k) + '</span>' +
              '<button class="del" data-act="del" data-meal="' + m.k + '" data-i="' + i + '">×</button></div>';
          }).join("") + '</div>' : '<div class="meal-empty">还没记录</div>') +
          '<button class="addfood" data-act="add" data-meal="' + m.k + '">＋ 添加食物</button>' +
          (pre.length ? '<div class="qchips" style="margin-top:8px">' + pre.map(function (p) {
            return '<button class="qchip" data-act="preset" data-id="' + p.id + '">' + p.name + '</button>';
          }).join("") + '</div>' : '') +
        '</div>';
      }).join("") +
    '</section>';

    var habits = '<section class="card">' +
      '<div class="card-h"><div class="card-title">今日习惯</div><div class="card-sub">随手记一下</div></div>' +
      '<div class="habits">' +
        '<div class="habit"><div class="hk">饮水</div><div class="hv">' + (d.water || 0).toFixed(2).replace(/\.?0+$/, "") + '<span> L</span></div>' +
          '<div class="stepper"><button data-act="water" data-d="-0.25">−</button><button data-act="water" data-d="0.25">＋</button></div></div>' +
        '<div class="habit"><div class="hk">睡眠</div><input type="number" step="0.5" min="0" max="14" data-bind="sleep" value="' + (d.sleep == null ? "" : d.sleep) + '" placeholder="7.5"></div>' +
        '<div class="habit"><div class="hk">步数</div><input type="number" step="500" min="0" data-bind="steps" value="' + (d.steps == null ? "" : d.steps) + '" placeholder="8000"></div>' +
      '</div>' +
    '</section>';

    var noteCard = '<section class="card">' +
      '<div class="card-h"><div class="card-title">一句话状态</div><div class="card-sub">今天感觉怎么样</div></div>' +
      '<textarea class="note" data-bind="note" placeholder="例：腰有点紧，腿举减到 50kg；晚上加班，晚餐吃了便利店组合">' + esc(d.note || "") + '</textarea>' +
    '</section>';

    var tip = '';
    if (plan.kind === "rest") tip = '<div class="card"><div class="warnbox">今天是休息日。可以散步、拉伸，别补练——恢复也是训练的一部分。</div></div>';

    return hero(dateStr) +
      '<div class="today-grid">' +
        '<div class="col">' + trainCard + habits + '</div>' +
        '<div class="col">' + mealsCard + noteCard + tip + '</div>' +
      '</div>';
  }

  /* ---------------- 记录：日历 / 周总结 / 月总结 ---------------- */
  function viewRecords() {
    var tab = ui.subtab || "calendar";
    var nav = '<div class="subnav">' +
      [["calendar", "日历"], ["week", "周总结"], ["month", "月总结"]].map(function (t) {
        return '<button class="' + (tab === t[0] ? "on" : "") + '" data-act="subtab" data-v="' + t[0] + '">' + t[1] + '</button>';
      }).join("") + '</div>';
    var body = tab === "week" ? viewWeek() : tab === "month" ? viewMonth() : viewCalendar();
    return nav + body;
  }

  function streakDays() {
    var streak = 0, cursor = todayStr();
    if (!dayStatus(cursor)) cursor = addDays(cursor, -1);
    while (dayStatus(cursor)) { streak++; cursor = addDays(cursor, -1); if (streak > 999) break; }
    return streak;
  }

  function rangeStats(a, b) {
    var out = { planned: 0, done: 0, partial: 0, recorded: 0, kcalSum: 0, kcalDays: 0, proteinSum: 0, proteinDays: 0, days: [] };
    var startDate = S.settings.startDate || START;
    for (var d = a; d <= b; d = addDays(d, 1)) {
      var plan = planFor(d);
      var st = trainStats(d);
      var counted = (plan.kind === "A" || plan.kind === "B" || plan.kind === "C" || plan.kind === "cardio");
      if (counted && d >= startDate) {
        out.planned++;
        if (st.pct >= 0.999) out.done++;
        else if (st.pct > 0) out.partial++;
      }
      var day = S.days[d];
      if (day) {
        var t = dayTotals(day);
        if (t.k > 0) { out.kcalSum += t.k; out.kcalDays++; out.recorded++; }
        if (t.p > 0) out.proteinSum += t.p;
        if (t.p >= S.settings.protein) out.proteinDays++;
      }
      var label = plan.kind === "cardio" ? "有氧 · 快走 / 椭圆机"
        : plan.kind === "optional" ? "可选 · 户外走 / 游泳 / 骑车"
        : plan.kind === "rest" ? "休息 + 拉伸"
        : plan.tag + " · " + plan.name;
      out.days.push({
        date: d, wd: WD_CN[wd(d)], tag: label, kind: plan.kind,
        done: st.any && st.pct >= 0.999, part: st.pct > 0 && st.pct < 0.999, started: st.any
      });
    }
    return out;
  }

  function bodyRange(a, b) {
    return Object.keys(S.body).filter(function (k) { return k >= a && k <= b; }).sort().map(function (k) {
      return { k: k, v: S.body[k] || {} };
    });
  }

  function weightChange(a, b) {
    var all = bodyRange(a, b);
    var ws = all.filter(function (x) { return x.v.w != null; });
    var as = all.filter(function (x) { return x.v.wa != null; });
    if (!ws.length && !as.length) return null;
    var o = { wn: ws.length, an: as.length };
    if (ws.length) { o.w1 = ws[0].v.w; o.w2 = ws[ws.length - 1].v.w; o.dw = Math.round((o.w2 - o.w1) * 10) / 10; }
    if (as.length) { o.a1 = as[0].v.wa; o.a2 = as[as.length - 1].v.wa; o.da = Math.round((o.a2 - o.a1) * 10) / 10; }
    return o;
  }

  function statBox(k, v) {
    return '<div class="stat"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';
  }

  function sign(n) { return (n > 0 ? "+" : "") + n; }

  function bodyChangeCard(wc, title) {
    if (!wc) return '<section class="card"><div class="card-h"><div class="card-title">' + title + '</div></div>' +
      '<div class="muted small">还没有体重/腰围记录，去「日历」里补一条。</div></section>';
    var h = '<div class="small muted" style="margin-bottom:6px">体重 ' + wc.wn + ' 次 · 腰围 ' + wc.an + ' 次</div>';
    if (wc.w1 != null) h += '<div class="kv"><span>体重</span><b>' + sign(wc.dw) + ' kg <span class="muted small">' + wc.w1 + ' → ' + wc.w2 + '</span></b></div>';
    if (wc.a1 != null) h += '<div class="kv"><span>腰围</span><b>' + sign(wc.da) + ' cm <span class="muted small">' + wc.a1 + ' → ' + wc.a2 + '</span></b></div>';
    return '<section class="card"><div class="card-h"><div class="card-title">' + title + '</div><div class="card-sub">来自每周记录</div></div>' + h + '</section>';
  }

  function reviewCard(key, title, placeholder) {
    var v = (S.reviews[key] || {}).text || "";
    return '<section class="card"><div class="card-h"><div class="card-title">' + title + '</div><div class="card-sub">写给自己</div></div>' +
      '<textarea class="note" data-bind="review" data-key="' + key + '" placeholder="' + placeholder + '">' + esc(v) + '</textarea></section>';
  }

  function viewWeek() {
    var ws = ui.weekStart, we = addDays(ws, 6);
    var r = rangeStats(ws, we);
    var wk = weekIndex(ws);
    var avgK = r.kcalDays ? Math.round(r.kcalSum / r.kcalDays) : 0;
    var avgP = r.kcalDays ? Math.round(r.proteinSum / r.kcalDays) : 0;
    var rate = r.planned ? Math.round(r.done / r.planned * 100) : 0;
    var wc = weightChange(ws, we);

    var rows = r.days.map(function (x) {
      var label, cls;
      if (x.kind === "rest") { label = "休息"; cls = ""; }
      else if (x.kind === "optional") {
        label = x.done ? "完成" : (x.part ? "部分" : "可选");
        cls = x.done ? "done" : (x.part ? "part" : "");
      } else {
        label = x.done ? "完成" : (x.part ? "部分" : (x.started ? "未完成" : "未开始"));
        cls = x.done ? "done" : (x.part ? "part" : (x.started ? "miss" : ""));
      }
      return '<div class="wrow" data-act="dayjump" data-date="' + x.date + '">' +
        '<span class="wd">' + x.wd + '<br><span class="muted" style="font-size:10px">' + x.date.slice(5) + '</span></span>' +
        '<span class="wn">' + esc(x.tag) + '</span>' +
        '<span class="ws ' + cls + '">' + label + '</span></div>';
    }).join("");

    return '<section class="card">' +
        '<div class="cal-head"><button class="iconbtn" data-act="weekprev">‹</button>' +
        '<div class="cal-month">' + ws.slice(5) + ' – ' + we.slice(5) + (wk ? ' · 第 ' + wk + ' 周' : '') + '</div>' +
        '<button class="iconbtn" data-act="weeknext">›</button></div>' +
        '<div class="stats">' +
          statBox("训练完成", r.planned ? r.done + '<small>/' + r.planned + ' 次</small>' : '—') +
          statBox("完成率", r.planned ? rate + '<small>%</small>' : '—') +
          statBox("平均热量", avgK + '<small>kcal</small>') +
          statBox("蛋白达标", r.proteinDays + '<small>天</small>') +
        '</div>' +
        '<div class="small muted" style="margin-top:10px">' + (wk ? '' : '开营前 · ') + '连续打卡 ' + streakDays() + ' 天 · 记录 ' + r.recorded + ' 天 · 平均蛋白 ' + avgP + 'g</div>' +
      '</section>' +
      '<section class="card"><div class="card-h"><div class="card-title">每天完成情况</div><div class="card-sub">点一行跳到那天</div></div>' + rows + '</section>' +
      bodyChangeCard(wc, "本周身体变化") +
      reviewCard("w:" + ws, "本周小结", "例：这周练了 3 次，腰不疼；外卖 2 次，蛋白差一点");
  }

  function viewMonth() {
    var y = ui.sumMonth.y, m = ui.sumMonth.m;
    var first = ymd(new Date(y, m, 1, 12));
    var last = ymd(new Date(y, m + 1, 0, 12));
    var r = rangeStats(first, last);
    var avgK = r.kcalDays ? Math.round(r.kcalSum / r.kcalDays) : 0;
    var avgP = r.kcalDays ? Math.round(r.proteinSum / r.kcalDays) : 0;
    var rate = r.planned ? Math.round(r.done / r.planned * 100) : 0;
    var wc = weightChange(first, last);
    var key = "m:" + y + "-" + pad(m + 1);

    var rows = "", cur = weekStart(first), idx = 1;
    while (cur <= last) {
      var s = cur < first ? first : cur;
      var e = addDays(cur, 6) > last ? last : addDays(cur, 6);
      var rr = rangeStats(s, e);
      var kk = rr.kcalDays ? Math.round(rr.kcalSum / rr.kcalDays) : 0;
      var w2 = weightChange(s, e);
      var wi = weekIndex(cur);
      var title = wi ? "第 " + wi + " 周" : s.slice(5) + " – " + e.slice(5);
      var sub = wi ? '<br><span class="muted small">' + s.slice(5) + ' – ' + e.slice(5) + '</span>' : "";
      rows += '<div class="kv"><span><b>' + title + '</b>' + sub + '</span>' +
        '<span style="text-align:right">' + rr.done + '/' + rr.planned + ' 次<br><span class="muted small">' + kk + ' kcal' +
        (w2 && w2.dw != null ? ' · ' + sign(w2.dw) + ' kg' : '') + '</span></span></div>';
      cur = addDays(cur, 7);
      idx++;
    }

    return '<section class="card">' +
        '<div class="cal-head"><button class="iconbtn" data-act="monthprev">‹</button>' +
        '<div class="cal-month">' + y + ' 年 ' + (m + 1) + ' 月</div>' +
        '<button class="iconbtn" data-act="monthnext">›</button></div>' +
        '<div class="stats">' +
          statBox("训练完成", r.planned ? r.done + '<small>/' + r.planned + ' 次</small>' : '—') +
          statBox("完成率", r.planned ? rate + '<small>%</small>' : '—') +
          statBox("平均热量", avgK + '<small>kcal</small>') +
          statBox("蛋白达标", r.proteinDays + '<small>天</small>') +
        '</div>' +
        '<div class="small muted" style="margin-top:10px">打卡 ' + r.recorded + ' 天 · 连续 ' + streakDays() + ' 天 · 平均蛋白 ' + avgP + 'g</div>' +
      '</section>' +
      '<section class="card"><div class="card-h"><div class="card-title">分周对比</div><div class="card-sub">按周看进度</div></div>' + rows + '</section>' +
      bodyChangeCard(wc, "本月身体变化") +
      reviewCard(key, "本月小结", "例：这个月掉了 2.4kg，腰围少 3cm；下月把有氧加到 3 次");
  }

  /* ---------------- 日历 ---------------- */
  function viewCalendar() {
    var y = ui.cal.y, m = ui.cal.m;
    var first = new Date(y, m, 1, 12);
    var offset = (first.getDay() + 6) % 7;
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var cells = [];
    for (var i = 0; i < offset; i++) {
      var pd = new Date(y, m, 1 - (offset - i), 12);
      cells.push({ d: pd, out: true });
    }
    for (var d = 1; d <= daysInMonth; d++) cells.push({ d: new Date(y, m, d, 12), out: false });
    var extra = 0;
    while (cells.length % 7 !== 0) {
      extra++;
      cells.push({ d: new Date(y, m, daysInMonth + extra, 12), out: true });
    }

    var grid = cells.map(function (c) {
      var k = ymd(c.d);
      var st = dayStatus(k);
      var plan = planFor(k);
      var cls = "cal-day" + (c.out ? " out" : "");
      if (st) cls += " " + st;
      if (!st && plan.kind === "rest") cls += " rest";
      if (k === todayStr()) cls += " today";
      return '<button class="' + cls + '" data-act="calday" data-date="' + k + '"><span class="d">' + c.d.getDate() + '</span><span class="dot"></span></button>';
    }).join("");

    var bodyList = Object.keys(S.body).sort().reverse();
    var chartData = bodyList.slice(0, 16).reverse().map(function (k) {
      return { x: k, y: S.body[k].w };
    }).filter(function (p) { return p.y != null; });

    var bodyRows = bodyList.slice(0, 8).map(function (k) {
      var b = S.body[k];
      return '<div class="mrow"><span class="md">' + k.slice(5) + '</span><span class="mv"><b>' + (b.w == null ? "—" : b.w) + '</b><span>kg</span>' +
        (b.f != null ? '<span>· 体脂 ' + b.f + '%</span>' : '') +
        (b.wa != null ? '<span>· 腰 ' + b.wa + 'cm</span>' : '') + '</span>' +
        '<button class="del" data-act="delbody" data-date="' + k + '">×</button></div>';
    }).join("");

    return '<section class="card">' +
      '<div class="cal-head"><button class="iconbtn" data-act="calprev">‹</button>' +
      '<div class="cal-month">' + y + ' 年 ' + (m + 1) + ' 月</div>' +
      '<button class="iconbtn" data-act="calnext">›</button></div>' +
      '<div class="cal-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>' +
      '<div class="cal-grid">' + grid + '</div>' +
      '<div class="cal-legend"><span><i style="background:#1E6B4F"></i>完成</span><span><i style="background:#E0A03F"></i>部分</span><span><i style="background:#D14B33"></i>有记录未训练</span><span><i style="background:#D9DAD2"></i>未记录</span></div>' +
    '</section>' +
    '<section class="card">' +
      '<div class="card-h"><div class="card-title">身体数据</div><div class="card-sub">每周记一次就够</div></div>' +
      '<div class="form-grid">' +
        '<div class="field"><label>日期</label><input type="date" id="bd-date" value="' + todayStr() + '"></div>' +
        '<div class="field"><label>体重 kg</label><input type="number" step="0.1" id="bd-w" placeholder="102.4"></div>' +
        '<div class="field"><label>体脂率 %</label><input type="number" step="0.1" id="bd-f" placeholder="36.1"></div>' +
        '<div class="field"><label>腰围 cm</label><input type="number" step="0.5" id="bd-wa" placeholder="108"></div>' +
      '</div>' +
      '<div style="margin-top:10px"><button class="btn primary block" data-act="savebody">保存这次记录</button></div>' +
      (chartData.length >= 2 ? '<div class="chart">' + lineChart(chartData) + '</div>' : '<div class="muted small" style="margin-top:10px">记录 2 次以上就会画出体重曲线。</div>') +
      (bodyRows ? '<div class="mlist">' + bodyRows + '</div>' : '') +
    '</section>';
  }

  function weekStart(dateStr) {
    var d = parseYmd(dateStr);
    var off = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - off);
    return ymd(d);
  }

  function lineChart(data) {
    var W = 320, H = 120, P = 30;
    var ys = data.map(function (d) { return d.y; });
    var min = Math.min.apply(null, ys), max = Math.max.apply(null, ys);
    if (max === min) { max = min + 1; min = min - 1; }
    var pts = data.map(function (d, i) {
      var x = P + i * (W - 2 * P) / Math.max(1, data.length - 1);
      var y = H - P - (d.y - min) / (max - min) * (H - 2 * P);
      return [x, y];
    });
    var path = pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
    var dots = pts.map(function (p) { return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="#1E6B4F"/>'; }).join("");
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' +
      '<line x1="' + P + '" y1="' + (H - P) + '" x2="' + (W - P) + '" y2="' + (H - P) + '" stroke="#E3E5DD"/>' +
      '<path d="' + path + '" fill="none" stroke="#1E6B4F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' +
      dots +
      '<text x="' + P + '" y="' + (P - 8) + '" font-size="9" fill="#7B7C74">' + max.toFixed(1) + 'kg</text>' +
      '<text x="' + P + '" y="' + (H - 8) + '" font-size="9" fill="#7B7C74">' + min.toFixed(1) + 'kg</text>' +
      '<text x="' + (W - P) + '" y="' + (H - 8) + '" font-size="9" fill="#7B7C74" text-anchor="end">' + data[data.length - 1].x.slice(5) + '</text>' +
    '</svg>';
  }

  /* ---------------- 动作教程 ---------------- */
  function tutItems() {
    var out = [], seen = {};
    ["A", "B", "C"].forEach(function (k) {
      TRAIN[k].slots.forEach(function (slot) {
        slot.opts.forEach(function (id) {
          if (seen[id]) return;
          seen[id] = 1;
          out.push({ id: id, day: k, dir: slot.dir });
        });
      });
    });
    CARDIO.slots[1].opts.forEach(function (id) {
      if (seen[id]) return;
      seen[id] = 1;
      out.push({ id: id, day: "cardio", dir: "有氧 · 低冲击" });
    });
    return out;
  }

  function tutFiltered() {
    var q = (ui.tutQ || "").trim().toLowerCase();
    return tutItems().filter(function (it) {
      if (ui.tutFilter !== "all" && it.day !== ui.tutFilter) return false;
      var e = EX[it.id];
      if (!e) return false;
      if (q && (e.n + " " + e.eq + " " + it.dir).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }

  function tutListHtml() {
    var arr = tutFiltered();
    if (!arr.length) return '<div class="muted small" style="padding:24px 0;text-align:center">没找到，换个词试试</div>';
    return arr.map(function (it) {
      var e = EX[it.id];
      var tech = TECH[TUT_OF[it.id]] || TECH.core;
      var open = ui.tutOpen === it.id;
      var dayName = it.day === "cardio" ? "有氧" : "力量 " + it.day;
      var canAnim = !!(FIGS_ANIM[tech.fig] && !REDUCED);
      return '<div class="tut ' + (open ? "open" : "") + '">' +
        '<div class="tut-h" data-act="tut" data-id="' + it.id + '">' +
          '<div class="tut-thumb">' + FIGS[tech.fig] + '</div>' +
          '<div class="tut-meta">' +
            '<div class="tut-name">' + esc(e.n) + '<span class="eqtag">' + esc(e.eq) + '</span>' + (canAnim ? '<span class="livebadge2">动图</span>' : '') + '</div>' +
            '<div class="tut-sub">' + dayName + ' · ' + esc(it.dir) + '</div>' +
          '</div>' +
          '<span class="tut-arrow">' + (open ? "−" : "+") + '</span>' +
        '</div>' +
        (open ? '<div class="tut-body">' +
          '<div class="tut-fig' + (canAnim ? " live" : "") + '"' + (canAnim ? ' data-act="animtoggle"' : '') + '>' +
            (canAnim ? FIGS_ANIM[tech.fig] : FIGS[tech.fig]) +
            (canAnim ? '<span class="livebadge">点图暂停</span>' : '') +
          '</div>' +
          '<div class="tut-sec">怎么做</div>' +
          '<ol class="steps">' + tech.steps.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + '</ol>' +
          '<div class="tut-sec">容易做错</div>' +
          '<ul class="errs">' + tech.errs.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + '</ul>' +
          '<div class="tut-breath">呼吸与节奏：' + esc(tech.breath) + '</div>' +
          (tech.safe ? '<div class="tut-safe">⚠ ' + esc(tech.safe) + '</div>' : '') +
          '<div class="small muted" style="margin-top:8px">器械：' + esc(e.eq) + ' · 组次：' + esc(e.s) + ' · 要点：' + esc(e.tip) + '</div>' +
        '</div>' : '') +
      '</div>';
    }).join("");
  }

  function viewTutorial() {
    var days = [["all", "全部"], ["A", "A 下肢"], ["B", "B 上肢"], ["C", "C 后链"], ["cardio", "有氧"]];
    var n = tutItems().length;
    return '<section class="card">' +
      '<div class="card-h"><div><div class="card-title">动作教程</div><div class="card-sub">零基础也能看懂 · 点开看步骤</div></div>' +
      '<div class="tag">' + n + ' 个动作</div></div>' +
      '<input class="search" id="tut-q" placeholder="搜动作或器械：腿举、哑铃、弹力带…" value="' + esc(ui.tutQ) + '">' +
      '<div class="cats">' + days.map(function (d) {
        return '<button class="chip ' + (ui.tutFilter === d[0] ? "on" : "") + '" data-act="tutf" data-v="' + d[0] + '">' + d[1] + '</button>';
      }).join("") + '</div>' +
      '<div id="tut-list">' + tutListHtml() + '</div>' +
    '</section>' +
    '<section class="card"><div class="warnbox">示意图只表示动作方向，不追求解剖细节。第一次用某个器械，先用最轻重量试 8 次，确认腰和膝盖没有不适再加重量。</div></section>';
  }

  /* ---------------- 计划 ---------------- */
  function viewPlan() {
    var sched = '<table class="plan-table"><tr><th>时间</th><th>内容</th><th>时长</th></tr>' +
      PLAN.schedule.map(function (r) { return '<tr><td><b>' + r[0] + '</b></td><td>' + r[1] + '</td><td class="muted">' + r[2] + '</td></tr>'; }).join("") + '</table>';

    var prog = '<table class="plan-table"><tr><th>周次</th><th>频率</th><th>组数</th><th>目标</th></tr>' +
      PLAN.progression.map(function (r) { return '<tr><td><b>' + r[0] + '</b></td><td>' + r[1] + '</td><td>' + r[2] + '</td><td class="muted">' + r[4] + '</td></tr>'; }).join("") + '</table>';

    var ex = ["A", "B", "C"].map(function (k) {
      return '<div style="margin:10px 0 14px"><span class="tag">' + TRAIN[k].tag + ' · ' + TRAIN[k].day + '</span>' +
        TRAIN[k].slots.map(function (s) {
          var d = EX[s.def];
          return '<div class="slotrow">' +
            '<div class="slotdir">' + s.dir + '</div>' +
            '<div class="slotdef">' + d.n + ' <span class="muted small">' + d.s + ' · ' + d.eq + '</span></div>' +
            '<div class="slotopts">' + s.opts.map(function (id) {
              var e = EX[id];
              return '<span class="optpill' + (id === s.def ? " on" : "") + '">' + e.n + '<i>' + e.eq + '</i></span>';
            }).join("") + '</div></div>';
        }).join("") + '</div>';
    }).join("") +
      '<div style="margin:4px 0 2px"><span class="tag">有氧 · 周二 / 周四</span>' +
      '<div class="slotopts" style="margin-top:8px">' + CARDIO.slots[1].opts.map(function (id) {
        var e = EX[id];
        return '<span class="optpill' + (id === "walk" ? " on" : "") + '">' + e.n + '<i>' + e.eq + '</i></span>';
      }).join("") + '</div></div>';

    var caf = '<div class="stats" style="grid-template-columns:1fr 1fr">' +
      '<div class="stat" style="background:#F3F8F4"><div class="k" style="color:#1E6B4F;font-weight:700">优先选择</div><ul style="margin:6px 0 0;padding-left:16px;font-size:12px;line-height:1.7">' +
        PLAN.cafRed.map(function (x) { return "<li>" + x + "</li>"; }).join("") + '</ul></div>' +
      '<div class="stat" style="background:#FBF0E2"><div class="k" style="color:#B06F1C;font-weight:700">尽量避开</div><ul style="margin:6px 0 0;padding-left:16px;font-size:12px;line-height:1.7">' +
        PLAN.cafBlack.map(function (x) { return "<li>" + x + "</li>"; }).join("") + '</ul></div></div>';

    var menu = MENU.map(function (r) {
      return '<div style="padding:9px 0;border-bottom:1px dashed var(--line)">' +
        '<div style="font-weight:700;font-size:12.5px">' + r.d + '</div>' +
        '<div class="small" style="color:#4A4B44;line-height:1.65;margin-top:2px">' +
          '早：' + r.b + '<br>加餐：' + r.s + '<br>午：' + r.l + '<br>晚：' + r.dn +
        '</div></div>';
    }).join("");

    var phases = '<table class="plan-table"><tr><th>阶段</th><th>体重</th><th>体脂</th><th>重点</th></tr>' +
      PHASES.map(function (p) { return '<tr><td><b>' + p.name + '</b><br><span class="muted small">' + p.start.slice(2) + ' – ' + p.end.slice(2) + '</span></td><td>' + p.weight + '</td><td>' + p.fat + '</td><td class="muted">' + p.focus + '</td></tr>'; }).join("") + '</table>';

    var emerg = PLAN.emergency.map(function (r) { return '<div class="kv"><b>' + r[0] + '</b><span style="flex:1;text-align:right;color:#555">' + r[1] + '</span></div>'; }).join("");

    return '<section class="card">' +
      '<div class="card-h"><div class="card-title">训练计划</div><div class="card-sub">周一 A · 周三 B · 周五 C</div></div>' +
      acc("每周安排", sched, true) +
      acc("动作库", '<p class="muted small" style="margin-bottom:8px">到健身房先看器械：能对上哪个就用哪个；没有器械就选自重或弹力带版本。训练方向不变，点今日训练里的「换」就能替换。</p>' + ex) +
      acc("8 周进阶", prog) +
      acc("禁忌动作", '<p style="color:#AD4630">' + PLAN.avoid + '</p><p class="muted small">日常：久坐加腰靠、每 60 分钟起身；搬东西屈髋屈膝；起床先侧身撑起。</p>') +
    '</section>' +
    '<section class="card">' +
      '<div class="card-h"><div class="card-title">怎么吃</div><div class="card-sub">食堂为主</div></div>' +

      acc("7 天菜单", menu) +

    '</section>' +
    '<section class="card">' +
      '<div class="card-h"><div class="card-title">周期</div><div class="card-sub">48 周 + 13 周维持</div></div>' +
      acc("阶段目标", phases, true) +
      '<div class="warnbox" style="margin-top:10px">出现腿麻、腿无力、夜间痛醒或大小便异常，先就医，不要先训练。</div>' +
    '</section>';
  }

  function acc(title, body, open) {
    return '<details class="acc"' + (open ? " open" : "") + '><summary>' + title + '</summary><div class="acc-body">' + body + '</div></details>';
  }

  /* ---------------- 采购 ---------------- */
  function shopKey(list, i) { return list + "-" + i; }
  function viewShop() {
    var wk = weekStart(todayStr());
    if (S.shop.week !== wk) { S.shop.week = wk; S.shop.checked = {}; save(); }
    var total = SHOP.sunday.items.length + SHOP.wednesday.items.length;
    var done = Object.keys(S.shop.checked).filter(function (k) { return S.shop.checked[k]; }).length;

    function listBlock(key, data) {
      var items = data.items.map(function (it, i) {
        var k = shopKey(key, i);
        var on = !!S.shop.checked[k];
        return '<div class="shop-item ' + (on ? "on" : "") + '" data-act="shop" data-k="' + k + '">' +
          '<span class="shop-check">' + (on ? "✓" : "") + '</span>' +
          '<span class="shop-cat">' + it.c + '</span>' +
          '<span class="sn">' + it.n + '</span>' +
          '<span class="sa">' + it.a + '</span>' +
        '</div>';
      }).join("");
      return '<div class="shop-block" style="margin-top:14px">' +
        '<div class="shop-head"><div><div class="card-title">' + data.title + '</div><div class="card-sub">' + data.sub + '</div></div>' +
        '<span class="tag">' + data.items.length + ' 项</span></div>' +
        items + '</div>';
    }

    return '<section class="card">' +
      '<div class="card-h"><div><div class="card-title">本周采购</div><div class="card-sub">' + wk + ' 起这一周</div></div>' +
      '<button class="btn ghost" style="height:32px;padding:0 12px;font-size:12px" data-act="shopreset">重置</button></div>' +
      '<div class="shop-prog"><i style="width:' + (total ? Math.round(done / total * 100) : 0) + '%"></i></div>' +
      '<div class="small muted">已买 ' + done + ' / ' + total + ' 项</div>' +
      listBlock("sun", SHOP.sunday) +
      listBlock("wed", SHOP.wednesday) +
      '<div style="margin-top:16px"><div class="card-title">常温囤货</div><div class="card-sub" style="margin-bottom:6px">2–4 周补一次</div>' +
      '<div style="font-size:13px;line-height:1.9;color:#3A3B35">' + SHOP.pantry.join(" · ") + '</div></div>' +
    '</section>' +
    '<section class="card"><div class="warnbox">没有冷冻室：生禽肉冷藏 1–2 天、生牛肉 2–3 天、熟食 3 天。周日买前半周，周三顺路补后半周，别一次囤五天。</div></section>';
  }
