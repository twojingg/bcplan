  /* ---------------- 弹层：食物 ---------------- */
  function openFood(meal) {
    ui.modal = { type: "food", meal: meal, q: "", cat: "全部", pick: null, grams: null, custom: false };
    renderModal();
  }
  function closeModal() { ui.modal = null; document.getElementById("modal-root").innerHTML = ""; }

  function openSwap(slotId) {
    var slot = findSlot(slotId);
    if (!slot) return;
    ui.modal = { type: "swap", slot: slot, asDefault: false };
    renderModal();
  }

  function applySwap(exId) {
    var m = ui.modal;
    if (!m || m.type !== "swap") return;
    var slot = m.slot;
    var d = ensureDay(ui.date);
    var rec = d.train[slot.id] || {};
    if (m.asDefault) {
      S.prefs[slot.id] = exId;
      delete rec.ex;
    } else {
      var base = S.prefs[slot.id] || slot.def;
      if (exId === base) delete rec.ex;
      else rec.ex = exId;
    }
    d.train[slot.id] = rec;
    flush();
    closeModal();
    render();
    toast("已换成 " + EX[exId].n + (m.asDefault ? "（以后默认）" : ""));
  }

  function resetEx() {
    var m = ui.modal;
    if (!m || m.type !== "swap") return;
    var slot = m.slot;
    delete S.prefs[slot.id];
    var d = ensureDay(ui.date);
    if (d.train[slot.id]) delete d.train[slot.id].ex;
    flush();
    closeModal();
    render();
    toast("已恢复默认动作");
  }

  function allFoods() {
    return S.customFoods.map(function (f) { return Object.assign({ custom: true }, f); }).concat(FOODS);
  }
  function filteredFoods() {
    var q = (ui.modal.q || "").trim().toLowerCase();
    return allFoods().filter(function (f) {
      if (ui.modal.cat !== "全部" && f.c !== ui.modal.cat && !(ui.modal.cat === "自定义" && f.custom)) return false;
      if (q && f.n.toLowerCase().indexOf(q) < 0) return false;
      return true;
    }).slice(0, 60);
  }

  function foodListHtml() {
    var list = filteredFoods().map(function (f) {
      return '<div class="fitem" data-act="pick" data-id="' + f.i + '">' +
        '<div class="fi"><div class="fname">' + esc(f.n) + (f.custom ? '<span class="custom-tag">自定义</span>' : "") + '</div>' +
        '<div class="fsub">' + f.c + ' · 蛋白 ' + f.p + 'g/100g</div></div>' +
        '<div class="fk">' + f.k + '<span style="font-size:10px;font-weight:500;color:#9A9B93"> kcal</span></div></div>';
    }).join("");
    return list || '<div class="muted small" style="padding:20px 0;text-align:center">没找到，换个词或自定义一个</div>';
  }

  function renderModal() {
    var m = ui.modal;
    var root = document.getElementById("modal-root");
    if (!m) { root.innerHTML = ""; return; }

    var inner;
    if (m.type === "food") {
      if (m.pick) {
        var f = m.pick;
        var grams = m.grams || f.g || 100;
        var k = Math.round(f.k * grams / 100);
        var p = Math.round(f.p * grams / 100 * 10) / 10;
        inner = '<div class="sheet-h"><div class="sheet-t">' + esc(f.n) + '<span class="custom-tag">' + (f.k) + ' kcal/100g</span></div>' +
          '<button class="iconbtn" data-act="closemodal">×</button></div>' +
          '<div class="sheet-b">' +
            '<div class="muted small" style="margin-bottom:8px">每 100g：' + f.k + ' kcal · 蛋白 ' + f.p + 'g</div>' +
            '<div class="grams"><input type="number" id="gram-input" value="' + grams + '" min="1" step="10"><span class="u">克</span></div>' +
            '<div class="qchips">' + [50, 100, 150, 200, 250].map(function (g) {
              return '<button class="qchip ' + (g === grams ? "on" : "") + '" data-act="grams" data-g="' + g + '">' + g + 'g</button>';
            }).join("") + '</div>' +
            '<div class="calcbox"><div><div class="ck">热量</div><div class="cv">' + k + ' kcal</div></div>' +
            '<div style="text-align:right"><div class="ck">蛋白质</div><div class="cv">' + p + ' g</div></div></div>' +
          '</div>' +
          '<div class="sheet-f"><button class="btn ghost" data-act="backfood" style="flex:0 0 96px">返回</button>' +
          '<button class="btn primary" data-act="confirmfood" style="flex:1">加入' + mealName(m.meal) + '</button></div>';
      } else if (m.custom) {
        inner = '<div class="sheet-h"><div class="sheet-t">自定义食物</div><button class="iconbtn" data-act="closemodal">×</button></div>' +
          '<div class="sheet-b">' +
            '<div class="field" style="margin-bottom:10px"><label>名称</label><input id="cf-name" placeholder="例：公司食堂的土豆烧鸡"></div>' +
            '<div class="form-grid">' +
              '<div class="field"><label>每 100g 热量</label><input type="number" id="cf-k" placeholder="150"></div>' +
              '<div class="field"><label>每 100g 蛋白</label><input type="number" id="cf-p" placeholder="12"></div>' +
            '</div>' +
            '<div class="small muted" style="margin-top:10px">不确定就按同类菜估一个值，先能记录比精确更重要。</div>' +
          '</div>' +
          '<div class="sheet-f"><button class="btn ghost" data-act="backfood" style="flex:0 0 96px">返回</button>' +
          '<button class="btn primary" data-act="savecustom" style="flex:1">保存并添加</button></div>';
      } else {
        inner = '<div class="sheet-h"><div class="sheet-t">添加食物 · ' + mealName(m.meal) + '</div>' +
          '<button class="iconbtn" data-act="closemodal">×</button></div>' +
          '<div class="sheet-b">' +
            '<input class="search" id="food-q" placeholder="搜索：鸡胸、米饭、酸奶…" value="' + esc(m.q) + '">' +
            '<div class="cats">' + CATS.concat(["自定义"]).map(function (c) {
              return '<button class="chip ' + (m.cat === c ? "on" : "") + '" data-act="cat" data-c="' + c + '">' + c + '</button>';
            }).join("") + '</div>' +
            '<div id="food-list">' + foodListHtml() + '</div>' +
          '</div>' +
          '<div class="sheet-f"><button class="btn ghost" style="flex:1" data-act="newcustom">＋ 自定义食物</button></div>';
      }
    } else if (m.type === "swap") {
      var slot = m.slot;
      var cur = exFor(slot, ui.date);
      inner = '<div class="sheet-h"><div class="sheet-t">换动作 · ' + esc(slot.dir) + '</div>' +
        '<button class="iconbtn" data-act="closemodal">×</button></div>' +
        '<div class="sheet-b">' +
          '<div class="muted small" style="margin-bottom:10px">训练方向不变，选一个你现在有的器械；没有器械就选自重 / 弹力带版本。</div>' +
          slot.opts.map(function (id) {
            var e = EX[id];
            var isCur = id === cur.id;
            return '<div class="opt ' + (isCur ? "on" : "") + '" data-act="pickex" data-id="' + id + '">' +
              '<div class="oi">' +
                '<div class="optname">' + esc(e.n) + '<span class="eqtag">' + esc(e.eq) + '</span></div>' +
                '<div class="osub">' + esc(e.s) + ' · ' + esc(e.tip) + '</div>' +
              '</div>' +
              (isCur ? '<span class="ocheck">✓</span>' : '') +
            '</div>';
          }).join("") +
          '<div class="chk" data-act="asdef"><span class="cbox ' + (m.asDefault ? "on" : "") + '">' + (m.asDefault ? "✓" : "") + '</span>以后同类训练默认用这个</div>' +
          '<div class="row" style="gap:8px;margin-top:6px">' +
            '<button class="btn ghost" style="flex:1" data-act="tutfromswap">看这个动作的教程</button>' +
            (cur.custom ? '<button class="btn ghost" style="flex:1" data-act="resetex">恢复默认</button>' : '') +
          '</div>' +
        '</div>';
    }
    root.innerHTML = '<div class="overlay" data-act="overlay"><div class="sheet">' + inner + '</div></div>';
    if (m.type === "food" && !m.pick && !m.custom) {
      var inp = document.getElementById("food-q");
      if (inp) {
        inp.focus();
        inp.setSelectionRange(inp.value.length, inp.value.length);
      }
    }
  }

  function mealName(k) {
    for (var i = 0; i < MEALS.length; i++) if (MEALS[i].k === k) return MEALS[i].n;
    return "";
  }

  function addFoodItem(meal, food, grams) {
    var d = ensureDay(ui.date);
    var k = Math.round(food.k * grams / 100);
    var p = Math.round(food.p * grams / 100 * 10) / 10;
    d.meals[meal].push({ id: food.i, n: food.n, g: grams, k: k, p: p });
    save();
  }

  /* ---------------- 渲染 ---------------- */
  function render() {
    var app = document.getElementById("app");
    var tabs = [
      ["today", "今日", "◉"], ["records", "记录", "▦"], ["plan", "计划", "☰"],
      ["tut", "动作", "▣"], ["shop", "采购", "▤"], ["settings", "设置", "⚙"]
    ];
    var nav = '<nav class="tabbar"><div class="tabbar-inner">' + tabs.map(function (t) {
      return '<button class="tab ' + (ui.tab === t[0] ? "on" : "") + '" data-act="tab" data-tab="' + t[0] + '">' +
        '<span class="ti">' + t[2] + '</span><span class="tl">' + t[1] + '</span></button>';
    }).join("") + '</div></nav>';

    var top = '<header class="topbar"><div class="topbar-inner">' +
      '<div class="brand"><span class="dot"></span>体成分计划<small>48 周</small></div>' +
      (ui.tab === "today" ?
        '<div class="daynav"><button class="iconbtn" data-act="prev">‹</button>' +
        '<button class="today-btn" data-act="today">今天</button>' +
        '<button class="iconbtn" data-act="next">›</button></div>' : '') +
      '</div></header>';

    var body = "";
    if (ui.tab === "today") body = viewToday();
    else if (ui.tab === "records") body = viewRecords();
    else if (ui.tab === "tut") body = viewTutorial();
    else if (ui.tab === "plan") body = viewPlan();
    else if (ui.tab === "shop") body = viewShop();
    else body = viewSettings();

    app.innerHTML = top + '<main class="app" id="view">' + body + '</main>' + nav;
  }

  /* ---------------- 事件 ---------------- */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act");
    var dk = ui.date;

    if (act === "tab") { ui.tab = el.getAttribute("data-tab"); render(); window.scrollTo(0, 0); return; }
    if (act === "tutf") { ui.tutFilter = el.getAttribute("data-v"); render(); return; }
    if (act === "tut") {
      var tid = el.getAttribute("data-id");
      ui.tutOpen = ui.tutOpen === tid ? null : tid;
      render();
      return;
    }
    if (act === "animtoggle") {
      var sv = el.querySelector("svg");
      if (sv) {
        if (sv.getAttribute("data-paused") === "1") {
          sv.unpauseAnimations();
          sv.setAttribute("data-paused", "0");
        } else {
          sv.pauseAnimations();
          sv.setAttribute("data-paused", "1");
        }
      }
      return;
    }
    if (act === "prev") { ui.date = addDays(ui.date, -1); syncCalToDate(); render(); return; }
    if (act === "next") { ui.date = addDays(ui.date, 1); syncCalToDate(); render(); return; }
    if (act === "today") { ui.date = todayStr(); syncCalToDate(); render(); return; }

    if (act === "status") {
      var id = el.getAttribute("data-id");
      var v = el.getAttribute("data-v");
      var d = ensureDay(dk);
      var rec = d.train[id] || {};
      rec.v = v;
      d.train[id] = rec;
      save(); render(); return;
    }
    if (act === "water") {
      var d2 = ensureDay(dk);
      var delta = parseFloat(el.getAttribute("data-d"));
      d2.water = Math.max(0, Math.round(((d2.water || 0) + delta) * 100) / 100);
      save(); render(); return;
    }
    if (act === "add") { openFood(el.getAttribute("data-meal")); return; }
    if (act === "swap") { openSwap(el.getAttribute("data-slot")); return; }
    if (act === "del") {
      var meal = el.getAttribute("data-meal");
      var i = parseInt(el.getAttribute("data-i"), 10);
      var d3 = ensureDay(dk);
      d3.meals[meal].splice(i, 1);
      save(); render(); return;
    }
    if (act === "preset") {
      var pid = el.getAttribute("data-id");
      var preset = PRESETS.filter(function (p) { return p.id === pid; })[0];
      if (preset) {
        preset.items.forEach(function (it) {
          var f = FOOD_MAP[it[0]];
          if (f) addFoodItem(preset.meal, f, it[1]);
        });
        flush(); render(); toast("已添加：" + preset.name);
      }
      return;
    }
    if (act === "calprev") { ui.cal.m--; if (ui.cal.m < 0) { ui.cal.m = 11; ui.cal.y--; } render(); return; }
    if (act === "calnext") { ui.cal.m++; if (ui.cal.m > 11) { ui.cal.m = 0; ui.cal.y++; } render(); return; }
    if (act === "subtab") { ui.subtab = el.getAttribute("data-v"); render(); window.scrollTo(0, 0); return; }
    if (act === "weekprev" || act === "weeknext") {
      ui.weekStart = addDays(ui.weekStart, act === "weekprev" ? -7 : 7);
      render(); return;
    }
    if (act === "monthprev" || act === "monthnext") {
      var md = new Date(ui.sumMonth.y, ui.sumMonth.m + (act === "monthprev" ? -1 : 1), 1, 12);
      ui.sumMonth = { y: md.getFullYear(), m: md.getMonth() };
      render(); return;
    }
    if (act === "dayjump") {
      ui.date = el.getAttribute("data-date");
      ui.tab = "today";
      syncCalToDate();
      render(); window.scrollTo(0, 0); return;
    }
    if (act === "calday") {
      ui.date = el.getAttribute("data-date");
      ui.tab = "today";
      syncCalToDate();
      render(); window.scrollTo(0, 0); return;
    }
    if (act === "savebody") {
      var bd = document.getElementById("bd-date").value || todayStr();
      var w = parseFloat(document.getElementById("bd-w").value);
      var f = parseFloat(document.getElementById("bd-f").value);
      var wa = parseFloat(document.getElementById("bd-wa").value);
      if (!w && !f && !wa) { toast("至少填一项"); return; }
      S.body[bd] = { w: isNaN(w) ? null : w, f: isNaN(f) ? null : f, wa: isNaN(wa) ? null : wa };
      flush(); render(); toast("已保存 " + bd); return;
    }
    if (act === "delbody") {
      var dd = el.getAttribute("data-date");
      if (confirm("删除 " + dd + " 的身体数据？")) { delete S.body[dd]; flush(); render(); }
      return;
    }
    if (act === "shop") {
      var k = el.getAttribute("data-k");
      S.shop.checked[k] = !S.shop.checked[k];
      save(); render(); return;
    }
    if (act === "shopreset") {
      if (confirm("清空本周采购勾选？")) { S.shop.checked = {}; flush(); render(); }
      return;
    }
    if (act === "savesettings") {
      var kc = parseInt(document.getElementById("st-kcal").value, 10);
      var pr = parseInt(document.getElementById("st-protein").value, 10);
      var sw = parseFloat(document.getElementById("st-sw").value);
      var gw = parseFloat(document.getElementById("st-gw").value);
      if (kc > 800) S.settings.kcal = kc;
      if (pr > 30) S.settings.protein = pr;
      if (!isNaN(sw)) S.settings.startWeight = sw;
      if (!isNaN(gw)) S.settings.goalWeight = gw;
      flush(); render(); toast("设置已保存"); return;
    }
    if (act === "export") { doExport(); return; }
    if (act === "import") { var fi = document.getElementById("file-import"); if (fi) fi.click(); return; }
    if (act === "reset") {
      if (confirm("确定清空全部记录？建议先导出备份。")) {
        if (confirm("再确认一次：所有打卡、饮食、身体数据都会删除。")) {
          S = defaultState(); flush(); render(); toast("已清空");
        }
      }
      return;
    }

    /* modal */
    if (act === "closemodal") { closeModal(); return; }
    if (act === "overlay") { if (e.target === el) closeModal(); return; }
    if (act === "pickex") { applySwap(el.getAttribute("data-id")); return; }
    if (act === "asdef") { ui.modal.asDefault = !ui.modal.asDefault; renderModal(); return; }
    if (act === "resetex") { resetEx(); return; }
    if (act === "tutfromswap") {
      var tslot = ui.modal.slot;
      var tid2 = exFor(tslot, ui.date).id;
      closeModal();
      ui.tab = "tut";
      ui.tutFilter = "all";
      ui.tutQ = "";
      ui.tutOpen = tid2;
      render();
      window.scrollTo(0, 0);
      return;
    }
    if (act === "cat") { ui.modal.cat = el.getAttribute("data-c"); renderModal(); return; }
    if (act === "pick") {
      var fid = el.getAttribute("data-id");
      var food = allFoods().filter(function (f) { return f.i === fid; })[0];
      if (food) { ui.modal.pick = food; ui.modal.grams = food.g || 100; renderModal(); }
      return;
    }
    if (act === "backfood") { ui.modal.pick = null; ui.modal.custom = false; renderModal(); return; }
    if (act === "grams") {
      ui.modal.grams = parseInt(el.getAttribute("data-g"), 10);
      renderModal(); return;
    }
    if (act === "confirmfood") {
      var g = parseFloat(document.getElementById("gram-input").value);
      if (!g || g <= 0) { toast("请输入克数"); return; }
      var mName = mealName(ui.modal.meal);
      addFoodItem(ui.modal.meal, ui.modal.pick, g);
      flush(); closeModal(); render(); toast("已加入" + mName);
      return;
    }
    if (act === "newcustom") { ui.modal.custom = true; ui.modal.pick = null; renderModal(); return; }
    if (act === "savecustom") {
      var name = (document.getElementById("cf-name").value || "").trim();
      var ck = parseFloat(document.getElementById("cf-k").value);
      var cp = parseFloat(document.getElementById("cf-p").value);
      if (!name) { toast("填个名称"); return; }
      if (!ck || ck <= 0) { toast("填一下每 100g 热量"); return; }
      var nf = { i: "c" + uid(), n: name, k: ck, p: isNaN(cp) ? 0 : cp, c: "自定义", g: 100, u: "份" };
      S.customFoods.push(nf);
      addFoodItem(ui.modal.meal, nf, 100);
      flush(); closeModal(); render(); toast("已保存并添加");
      return;
    }
  });

  /* 输入事件：不重绘，避免丢焦点 */
  var inputTimer = null;
  document.addEventListener("input", function (e) {
    var t = e.target;

    if (t.id === "food-q" && ui.modal) {
      ui.modal.q = t.value;
      var fl = document.getElementById("food-list");
      if (fl) fl.innerHTML = foodListHtml();
      return;
    }

    if (t.id === "tut-q") {
      ui.tutQ = t.value;
      var tl = document.getElementById("tut-list");
      if (tl) tl.innerHTML = tutListHtml();
      return;
    }

    var bind = t.getAttribute && t.getAttribute("data-bind");
    if (!bind) return;

    if (bind === "sleep" || bind === "steps") {
      var dd = ensureDay(ui.date);
      var v = t.value === "" ? null : parseFloat(t.value);
      dd[bind] = isNaN(v) ? null : v;
      scheduleSave();
      return;
    }
    if (bind === "note") {
      ensureDay(ui.date).note = t.value;
      scheduleSave();
      return;
    }
    if (bind === "review") {
      var rk = t.getAttribute("data-key");
      S.reviews[rk] = S.reviews[rk] || {};
      S.reviews[rk].text = t.value;
      S.reviews[rk].at = Date.now();
      scheduleSave();
      return;
    }
    if (bind === "ex") {
      var id = t.getAttribute("data-id");
      var field = t.getAttribute("data-f");
      var d = ensureDay(ui.date);
      var rec = d.train[id] || {};
      rec[field] = t.value;
      d.train[id] = rec;
      scheduleSave();
      return;
    }
  });

  function scheduleSave() {
    clearTimeout(inputTimer);
    inputTimer = setTimeout(flush, 300);
  }

  document.addEventListener("change", function (e) {
    if (e.target && e.target.id === "file-import") {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var o = JSON.parse(reader.result);
          if (!o || typeof o !== "object" || !o.days) throw new Error("bad");
          if (!confirm("导入会覆盖当前全部记录，确定？")) return;
          var base = defaultState();
          o.settings = Object.assign(base.settings, o.settings || {});
          o.customFoods = o.customFoods || [];
          o.body = o.body || {};
          o.reviews = o.reviews || {};
          o.prefs = o.prefs || {};
          o.shop = o.shop || { week: "", checked: {} };
          S = o;
          flush(); render(); toast("导入成功");
        } catch (err) {
          alert("文件格式不对，请选择本工具导出的 JSON 备份。");
        }
      };
      reader.readAsText(f);
      e.target.value = "";
    }
  });

  function doExport() {
    var data = JSON.stringify(S, null, 2);
    var blob = new Blob([data], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "体成分计划备份-" + todayStr() + ".json";
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    S.lastExport = Date.now();
    flush();
    toast("已导出，请保存到网盘或发给自己");
  }

  function syncCalToDate() {
    ui.cal = { y: parseInt(ui.date.slice(0, 4), 10), m: parseInt(ui.date.slice(5, 7), 10) - 1 };
  }

  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById("toast");
    if (!el) {
      el = document.createElement("div");
      el.id = "toast";
      el.className = "toast";
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2200);
  }

  window.addEventListener("beforeunload", flush);

  /* 启动 */
  try {
    localStorage.setItem("__bc_test", "1");
    localStorage.removeItem("__bc_test");
  } catch (e) {
    setTimeout(function () { toast("浏览器禁用了本地存储，记录无法保存"); }, 800);
  }
  render();
})();

</script>

<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
